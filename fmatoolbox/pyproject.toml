[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fmatoolbox"
version = "0.2.1"
description = "Python port of FMAToolbox"
authors = [{name = "Pietro Bozzo"}]
readme = "README.md"
license = "GPL-3.0-or-later"

requires-python = ">=3.10"
dependencies = [
    "loky",
    "numba",
    "numpy",
    "matplotlib",
    "scipy",
    "statsmodels",
]

[project.optional-dependencies]
assemblies = [
    "joblib",
    "scikit-learn",
    "scikit-image",
]
hierarch = [
    "hierarch",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/pietro-bozzo/FMAToolboxPython"
Repository = "https://github.com/pietro-bozzo/FMAToolboxPython"
Issues = "https://github.com/pietro-bozzo/FMAToolboxPython/issues"

[tool.setuptools.packages.find]
where = ["src"]
